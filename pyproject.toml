[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-agent"
version = "0.1.0"
description = "Multi-agent e-commerce support agent (capstone): supervisor + bounded specialists with deterministic policy enforcement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "langchain==1.4.5",
    "langchain-openai==1.7.1",
    "langgraph==1.2.15",
    "langsmith==0.14.8",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers==5.2.0",
    "transformers==4.57.3",
    "torch==2.9.1",
    "langchain-chroma==1.1.0",
    "chromadb==1.5.9",
    "PyYAML>=6",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]
eval = ["deepeval==4.2.8"]
ui = ["streamlit==1.65.0"]

[project.scripts]
capstone-agent = "capstone_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:deepeval -p no:rerunfailures"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
